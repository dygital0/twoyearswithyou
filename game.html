<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>For Vykha 💕</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #120020;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  width: 100vw;
  overflow: hidden;
  touch-action: none;
  font-family: 'Georgia', serif;
}

/* ── Outer shell: [LEFT-CTRL] [GAME] [RIGHT-CTRL] ── */
#shell {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 0;
  height: 100vh;
  width: 100vw;
}

/* ── Side panels ── */
.side-panel {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 12px;
  height: 100%;
  /* width set by JS / auto via content */
}

/* ── Game container: fills remaining space, aspect ~1:1.1 ── */
#game-wrap {
  position: relative;
  flex-shrink: 0;
  /* sized by JS */
}

#canvas-container {
  width: 100%;
  height: 100%;
  border-radius: 16px;
  overflow: hidden;
  border: 1.5px solid rgba(255,180,230,0.22);
  box-shadow:
    0 0 50px rgba(255,100,200,0.3),
    0 0 100px rgba(160,80,255,0.18);
}
canvas { display:block; width:100%!important; height:100%!important; }

/* ── HUD overlay (inside game-wrap) ── */
#hud {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(18,0,32,0.75);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,170,220,0.3);
  border-radius: 22px;
  padding: 5px 18px;
  color: #ffd6f0;
  font-size: 14px;
  letter-spacing: 0.05em;
  pointer-events: none;
  white-space: nowrap;
  z-index: 10;
}

/* ── Level label ── */
#level-label {
  position: absolute;
  top: 12px;
  left: 14px;
  background: rgba(18,0,32,0.7);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,170,220,0.25);
  border-radius: 16px;
  padding: 4px 14px;
  color: #f0c0e0;
  font-size: 12px;
  letter-spacing: 0.08em;
  pointer-events: none;
  z-index: 10;
}

/* ── Achievement toast ── */
#achievement {
  position: absolute;
  top: 55px;
  left: 50%;
  transform: translateX(-50%) translateY(-16px);
  background: rgba(18,0,40,0.92);
  backdrop-filter: blur(14px);
  border: 1.5px solid rgba(255,140,210,0.5);
  border-radius: 14px;
  padding: 10px 16px;
  color: #ffe0f5;
  font-size: 13px;
  line-height: 1.55;
  max-width: 220px;
  text-align: center;
  box-shadow: 0 0 24px rgba(255,80,180,0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
  z-index: 20;
}
#achievement.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#ach-label {
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #ffb3e6;
  margin-bottom: 5px;
}

/* ── Respawn flash ── */
#respawn-flash {
  position: absolute;
  inset: 0;
  border-radius: 16px;
  background: rgba(255,80,180,0.18);
  opacity: 0;
  pointer-events: none;
  z-index: 15;
  transition: opacity 0.15s;
}

/* ── D-pad ── */
.dpad {
  width: 124px;
  height: 124px;
  position: relative;
  flex-shrink: 0;
}
.dpad::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 24px; height: 24px;
  background: rgba(255,140,200,0.1);
  border: 1px solid rgba(255,170,220,0.2);
  border-radius: 50%;
}
.dpad-btn {
  position: absolute;
  width: 40px; height: 40px;
  background: rgba(255,170,220,0.14);
  border: 1.5px solid rgba(255,170,220,0.4);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,210,240,0.9);
  font-size: 16px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: background 0.08s, border-color 0.08s;
  touch-action: none;
}
.dpad-btn.pressed,
.dpad-btn:active {
  background: rgba(255,130,200,0.38);
  border-color: rgba(255,180,230,0.85);
}
.dpad-u { top:0;    left:42px; }
.dpad-d { bottom:0; left:42px; }
.dpad-l { top:42px; left:0;   }
.dpad-r { top:42px; right:0;  }

/* ── Jump button ── */
.jump-btn {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: rgba(255,130,200,0.18);
  border: 2px solid rgba(255,170,220,0.5);
  color: #ffd6f0;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  transition: background 0.08s;
  box-shadow: 0 0 16px rgba(255,80,180,0.25);
  flex-shrink: 0;
}
.jump-btn.pressed,
.jump-btn:active {
  background: rgba(255,130,200,0.48);
  box-shadow: 0 0 28px rgba(255,80,180,0.55);
}

/* ── Control labels ── */
.ctrl-label {
  font-size: 11px;
  color: rgba(255,180,220,0.45);
  letter-spacing: 0.06em;
  text-align: center;
}

/* ── Final screen ── */
#final-screen {
  position: absolute;
  inset: 0;
  border-radius: 16px;
  background: radial-gradient(ellipse at 50% 40%, #3a0048 0%, #180028 50%, #0c0018 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 2s ease;
  z-index: 100;
  text-align: center;
  padding: 30px;
  overflow: hidden;
}
#final-screen.visible { opacity:1; pointer-events:auto; }
#final-screen::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 35% 55%, rgba(255,80,160,0.14) 0%, transparent 55%),
    radial-gradient(circle at 65% 30%, rgba(140,60,240,0.16) 0%, transparent 55%);
  animation: fpulse 4s ease-in-out infinite alternate;
}
@keyframes fpulse { from{opacity:.6} to{opacity:1} }
#final-hearts {
  font-size: 38px; margin-bottom: 22px;
  animation: fheart 2.5s ease-in-out infinite alternate;
  position: relative; z-index: 2;
}
@keyframes fheart { from{transform:translateY(0)} to{transform:translateY(-10px)} }
#final-title {
  font-size: clamp(20px,4vw,34px);
  color: #ffd6f0;
  font-style: italic;
  line-height: 1.45;
  text-shadow: 0 0 30px rgba(255,140,210,0.8), 0 0 60px rgba(255,80,180,0.4);
  position: relative; z-index: 2;
  animation: tglow 3s ease-in-out infinite alternate;
}
@keyframes tglow {
  from{text-shadow:0 0 20px rgba(255,140,210,0.7),0 0 40px rgba(255,80,180,0.3)}
  to  {text-shadow:0 0 40px rgba(255,180,230,1),0 0 80px rgba(255,110,210,0.6)}
}
#final-sub {
  margin-top: 14px; font-size: 13px;
  color: rgba(255,190,225,0.65);
  letter-spacing: 0.06em;
  position: relative; z-index: 2;
}
#final-photo{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  max-width:70%;
  max-height:55%;
  object-fit:contain;
  opacity:0.28;
  border-radius:18px;
  z-index:1;
  pointer-events:none;
}
.particle {
  position: absolute; border-radius: 50%;
  pointer-events: none;
  animation: floatUp linear infinite;
  z-index: 1;
}
@keyframes floatUp {
  0%  { transform:translateY(110%) scale(0.5); opacity:0 }
  15% { opacity:1 }
  85% { opacity:1 }
  100%{ transform:translateY(-10%) scale(1.2); opacity:0 }
}

/* ── Level transition ── */
#level-transition {
  position: absolute;
  inset: 0;
  border-radius: 16px;
  background: rgba(18,0,30,0.0);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 50;
  transition: background 0.4s ease;
}
#level-transition.active {
  background: rgba(18,0,30,0.92);
}
#lt-text {
  color: #ffd6f0;
  font-size: 22px;
  font-style: italic;
  letter-spacing: 0.06em;
  opacity: 0;
  transition: opacity 0.4s ease;
  text-shadow: 0 0 20px rgba(255,130,200,0.7);
  text-align: center;
}
#level-transition.active #lt-text { opacity: 1; }
</style>
</head>
<body>

<div id="shell">
  <!-- LEFT: D-pad -->
  <div class="side-panel" id="left-panel">
    <div class="ctrl-label">MOVE</div>
    <div class="dpad" id="dpad-left">
      <div class="dpad-btn dpad-u" id="btn-up">▲</div>
      <div class="dpad-btn dpad-l" id="btn-left">◀</div>
      <div class="dpad-btn dpad-r" id="btn-right">▶</div>
      <div class="dpad-btn dpad-d" id="btn-down">▼</div>
    </div>
  </div>

  <!-- CENTER: Game -->
  <div id="game-wrap">
    <div id="canvas-container"></div>

    <div id="hud">✦ <span id="orb-counter">0 / 10</span> memories</div>
    <div id="level-label">Level <span id="level-num">1</span></div>

    <div id="achievement">
      <div id="ach-label">✦ memory unlocked ✦</div>
      <div id="ach-text"></div>
    </div>

    <div id="respawn-flash"></div>

    <div id="level-transition">
      <div id="lt-text"></div>
    </div>

    <div id="final-screen">
      <img id="final-photo" src="us.jpg" alt="Us"><div id="final-hearts">💕</div>
      <div id="final-title">Happy 2 Year<br>Anniversary Baby</div>
      <div id="final-sub">Love, from Dylan</div>
    </div>
  </div>

  <!-- RIGHT: Jump -->
  <div class="side-panel" id="right-panel">
    <div class="ctrl-label">JUMP</div>
    <div class="jump-btn" id="jump-btn-r">↑</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
//  ANNIVERSARY PARKOUR v2 — for Vykha 💕
//  5 levels · 2 orbs each · behind-player camera
// ═══════════════════════════════════════════════════════════

// ── Responsive sizing ────────────────────────────────────
const SIDE_W = 148; // px per side panel
const gameWrap = document.getElementById('game-wrap');
const leftPanel = document.getElementById('left-panel');
const rightPanel = document.getElementById('right-panel');

function sizeGame() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const availW = vw - SIDE_W * 2;
  const availH = vh;
  // Aim for ~0.9 aspect (slightly portrait)
  let gw = Math.min(availW, availH * 0.9);
  let gh = gw / 0.9;
  if (gh > availH) { gh = availH; gw = gh * 0.9; }
  gameWrap.style.width  = gw + 'px';
  gameWrap.style.height = gh + 'px';
  leftPanel.style.width  = SIDE_W + 'px';
  rightPanel.style.width = SIDE_W + 'px';
}
sizeGame();

// ── Achievement messages (10 total, 2 per level) ─────────
const MESSAGES = [
  // Level 1
  "You messaged me first",
  "I messaged you again after you ghosted me",
  // Level 2
  "We made it official too quick probably but I wouldn't change a thing 💞",
  "We met for the first time in the metro :))",
  // Level 3
  "We somehow make long distance work 🌍",
  "We had our first anniversary :), I was the happiest I'd ever been and still am ",
  // Level 4
  "We worked hard and achieved our goals even though we were committed to each other the whole time :)",
  "We went on our actual first date in Dubai Mall :)))",
  // Level 5 (final level — 1 orb + final platform)
  "I Love you so much Vykha ❤️",
  // index 9 — reached final platform (no orb)
];

// ── Level definitions ────────────────────────────────────
// Each level: array of platforms. First platform = spawn.
// Platform: { x,y,z, w,h,d, color, moving?, moveAxis, moveRange, moveSpeed, isFinal? }
// Levels progress forward along +X axis with a level offset applied.
// All levels start the player at x=0 relative to level.

const LEVEL_DEFS = [

  // ── LEVEL 1 — Gentle intro, generous gaps, low heights ──
  {
    name: "Level 1",
    color: 0xffd6f0,
    platforms: [
      { x:0,   y:0,   z:0,   w:7, h:0.5, d:6,  color:0xe8b8d8 }, // start
      { x:9,   y:0.5, z:0,   w:5, h:0.5, d:5,  color:0xd4a8f4 }, // easy jump
      { x:17,  y:1,   z:0,   w:5, h:0.5, d:5,  color:0xa8c8f4 }, // orb 0
      { x:25,  y:1.5, z:0,   w:6, h:0.5, d:6,  color:0xb8f0d4 }, // orb 1 → finish pad
    ],
    orbs: [2, 3], // platform indices
    msgIndices: [0, 1],
  },

  // ── LEVEL 2 — Slight height variation, one small gap ──
  {
    name: "Level 2",
    color: 0xd4b8ff,
    platforms: [
      { x:0,   y:0,   z:0,   w:6,  h:0.5, d:5,  color:0xd0b0f0 },
      { x:9,   y:1.5, z:1,   w:4,  h:0.5, d:4,  color:0xf0b0d8 },
      { x:16,  y:3,   z:-1,  w:4.5,h:0.5, d:4,  color:0xa8d8f8 }, // orb 2
      { x:24,  y:2,   z:1,   w:4,  h:0.5, d:4,  color:0xc8f0c0 },
      { x:32,  y:3,   z:0,   w:5,  h:0.5, d:5,  color:0xf8d8b0 }, // orb 3 → finish
    ],
    orbs: [2, 4],
    msgIndices: [2, 3],
  },

  // ── LEVEL 3 — Moving platform intro, medium gaps ──
  {
    name: "Level 3",
    color: 0xb8e0ff,
    platforms: [
      { x:0,   y:0,   z:0,   w:6,  h:0.5, d:5,  color:0xc8e8f8 },
      { x:9,   y:2,   z:0,   w:4,  h:0.5, d:4,  color:0xf4b0d8 },
      { x:17,  y:4,   z:1,   w:4,  h:0.5, d:4,  color:0xd0b8f8 }, // orb 4
      { x:24.5,y:4,   z:0,   w:8,h:0.35,d:0.9,color:0xf4d8a0 }, // balance beam
      { x:33,  y:5.5, z:0,   w:5,  h:0.5, d:5,  color:0xb0f0d8 }, // orb 5 → finish
    ],
    orbs: [2, 4],
    msgIndices: [4, 5],
  },

  // ── LEVEL 4 — Narrower platforms, a bit more height ──
  {
    name: "Level 4",
    color: 0xffc8e8,
    platforms: [
      { x:0,   y:0,   z:0,   w:5,  h:0.5, d:5,  color:0xe8c0e8 },
      { x:8,   y:2.5, z:1.5, w:3.5,h:0.5, d:3.5,color:0xf0a8c8 },
      { x:15.5,y:5,   z:-1,  w:3.5,h:0.5, d:3.5,color:0xa8c4f8 }, // orb 6
      { x:22.5,y:5,   z:1.5, w:3,  h:0.5, d:3,  color:0xf8e8a0, moving:true, moveAxis:'z', moveRange:4, moveSpeed:1.1 },
      { x:30,  y:7,   z:0,   w:3.5,h:0.5, d:3.5,color:0xc0f0b8 },
      { x:37.5,y:8,   z:0,   w:4.5,h:0.5, d:4.5,color:0xf4b8e8 }, // orb 7 → finish
    ],
    orbs: [2, 5],
    msgIndices: [6, 7],
  },

  // ── LEVEL 5 — Final level, dramatic, 1 orb + glowing end ──
  {
    name: "Level 5",
    color: 0xffd0f8,
    platforms: [
      { x:0,   y:0,   z:0,   w:5,  h:0.5, d:5,  color:0xf0b8e8 },
      { x:8.5, y:3,   z:1,   w:3.5,h:0.5, d:3.5,color:0xd0a8f8 },
      { x:16,  y:6,   z:-1.5,w:3,  h:0.5, d:3,  color:0xa8d0f8 }, // orb 8 (msg: "I love you")
      { x:23,  y:6,   z:1.5, w:3,  h:0.5, d:3,  color:0xf8d0a0, moving:true, moveAxis:'z', moveRange:4, moveSpeed:1.2 },
      { x:30,  y:7.5, z:-1.5,w:3,  h:0.5, d:3,  color:0xc8f0ff, moving:true, moveAxis:'z', moveRange:3.5, moveSpeed:1.0 },
      { x:37,  y:9,   z:1.5, w:3,  h:0.5, d:3,  color:0xffd0d0, moving:true, moveAxis:'z', moveRange:4.5, moveSpeed:1.4 },
      { x:45,  y:10.5,z:-1,  w:3,  h:0.5, d:3,  color:0xd8f0b0, moving:true, moveAxis:'z', moveRange:3, moveSpeed:1.3 },
      { x:54,  y:12.5,z:0,   w:6,  h:0.6, d:6,  color:0xffffff, isFinal:true }, // FINAL
    ],
    orbs: [2], // only 1 orb; final platform is the "10th"
    msgIndices: [8],
  },
];

// ── Three.js setup ───────────────────────────────────────
const container = document.getElementById('canvas-container');
let CW = container.clientWidth;
let CH = container.clientHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(CW, CH);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x0a0018);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x150025, 0.022);

const camera = new THREE.PerspectiveCamera(58, CW / CH, 0.1, 300);

// ── Lighting ─────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffd6f0, 0.65));

const dirLight = new THREE.DirectionalLight(0xffe0f8, 1.3);
dirLight.position.set(8, 20, 8);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 200;
dirLight.shadow.camera.left = dirLight.shadow.camera.bottom = -70;
dirLight.shadow.camera.right = dirLight.shadow.camera.top  = 70;
scene.add(dirLight);

const pinkLight   = new THREE.PointLight(0xff69b4, 1.8, 50);
const purpleLight = new THREE.PointLight(0x9b59b6, 1.4, 55);
pinkLight.position.set(0, 10, 0);
purpleLight.position.set(0, 8, -15);
scene.add(pinkLight, purpleLight);

// ── Sky sphere ───────────────────────────────────────────
const skyGeo = new THREE.SphereGeometry(150, 12, 12);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    top:    { value: new THREE.Color(0x080014) },
    bottom: { value: new THREE.Color(0x350045) },
  },
  vertexShader: `
    varying vec3 vPos;
    void main(){vPos=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader: `
    varying vec3 vPos;
    uniform vec3 top,bottom;
    void main(){float t=clamp((vPos.y+30.)/90.,0.,1.);gl_FragColor=vec4(mix(bottom,top,t),1.);}`,
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// ── Stars ────────────────────────────────────────────────
(function(){
  const pts = [];
  for(let i=0;i<350;i++){
    const theta = Math.random()*Math.PI*2;
    const phi   = Math.acos(2*Math.random()-1);
    const r = 130 + Math.random()*10;
    pts.push(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({color:0xffd6f0,size:0.55,sizeAttenuation:true})));
})();

// ── Player (GLB model, fallback to pink box) ─────────────
let player;
const PLAYER_H = 1.0;
const PLAYER_W = 0.7;

// Try loading the GLB; on error fall back to a box
const GLB_URL = './model.glb';

function makeFallbackPlayer() {
  const geo = new THREE.BoxGeometry(PLAYER_W, PLAYER_H, PLAYER_W);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xff88cc, emissive: 0xff44aa, emissiveIntensity: 0.45,
    roughness: 0.3, metalness: 0.1,
  });
  player = new THREE.Mesh(geo, mat);
  player.castShadow = true;
  player.position.set(0, 1.0, 0);
  scene.add(player);
  initGame();
}

// THREE GLTFLoader via CDN (unpkg mirrors the full three.js package including examples)
const gltfScript = document.createElement('script');
gltfScript.src = 'https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js';
gltfScript.onload = () => {
  const loader = new THREE.GLTFLoader();
  loader.load(
    GLB_URL,
    (gltf) => {
      player = gltf.scene;
      // Auto-scale: fit into ~1 unit tall
      const box3 = new THREE.Box3().setFromObject(player);
      const size = box3.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale  = 1.0 / maxDim;
      player.scale.setScalar(scale);
      // Re-center pivot at feet
      const box2 = new THREE.Box3().setFromObject(player);
      const center = box2.getCenter(new THREE.Vector3());
      player.position.sub(center);
      player.position.y += (box2.max.y - box2.min.y) / 2;

      player.traverse(c => { if(c.isMesh){ c.castShadow=true; } });
      player.position.set(0, PLAYER_H/2, 0);
      scene.add(player);
      initGame();
    },
    undefined,
    () => makeFallbackPlayer()
  );
};
gltfScript.onerror = () => makeFallbackPlayer();
document.head.appendChild(gltfScript);

// ── Game state ───────────────────────────────────────────
let pState, platforms, orbMeshes, currentLevel, extraObjects;
let standingPlatform = null;

const GRAVITY    = -20;
const JUMP_FORCE = 13;
const MOVE_SPEED = 5.2;
const DEATH_Y    = -10;

// Camera: FIXED world-space offset behind player — never rotates with player.
// Levels run along +X, so camera sits behind (at -X) and slightly above.
const CAM_OFFSET_X = -12;
const CAM_OFFSET_Y =  6;
const CAM_OFFSET_Z =  0;
const camSmoothPos  = new THREE.Vector3();
const camLookAt     = new THREE.Vector3();

function initGame() {
  pState = {
    vel: new THREE.Vector3(),
    onGround: false,
    jumpBuffer: 0,
    collected: 0,
    levelIndex: 0,
    finalTriggered: false,
    finishedGame: false,
    transitioning: false,
    levelSpawn: new THREE.Vector3(0, PLAYER_H/2 + 0.5, 0),
  };
  platforms    = [];
  orbMeshes    = [];
  extraObjects = [];

  loadLevel(0, false);
  updateHUD();
  if (!animStarted) { animStarted = true; animate(); }
}

// ── Level loading ─────────────────────────────────────────
function clearLevel() {
  platforms.forEach(p => { scene.remove(p.mesh); });
  orbMeshes.forEach(o => { scene.remove(o); if(o.userData.ring) scene.remove(o.userData.ring); });
  extraObjects.forEach(o => scene.remove(o));
  platforms    = [];
  orbMeshes    = [];
  extraObjects = [];
}

function loadLevel(idx, transition) {
  clearLevel();
  currentLevel = idx;
  document.getElementById('level-num').textContent = idx + 1;

  const def = LEVEL_DEFS[idx];

  def.platforms.forEach((pd, i) => {
    const geo = new THREE.BoxGeometry(pd.w, pd.h, pd.d);
    let mat;
    if (pd.isFinal) {
      mat = new THREE.MeshStandardMaterial({
        color: 0xffd8f8, emissive: 0xff55bb, emissiveIntensity: 0.9,
        roughness: 0.15, metalness: 0.35,
      });
    } else {
      mat = new THREE.MeshStandardMaterial({
        color: pd.color, emissive: pd.color, emissiveIntensity: 0.1,
        roughness: 0.55, metalness: 0.1,
      });
    }
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(pd.x, pd.y, pd.z);
    mesh.receiveShadow = true;
    mesh.castShadow    = true;
    scene.add(mesh);

    const pObj = {
      mesh, x:pd.x, y:pd.y, z:pd.z,
      w:pd.w, h:pd.h, d:pd.d,
      moving: pd.moving || false,
      moveAxis:  pd.moveAxis  || 'z',
      moveRange: pd.moveRange || 0,
      moveSpeed: pd.moveSpeed || 1,
      moveOrigin: pd.moveAxis === 'z' ? pd.z : pd.x,
      isFinal: pd.isFinal || false,
      t: 0,
    };
    platforms.push(pObj);

    // Portal rings on final platform
    if (pd.isFinal) {
      for (let r = 0; r < 3; r++) {
        const rg = new THREE.TorusGeometry(1.6 + r*0.65, 0.055, 8, 48);
        const rm = new THREE.MeshStandardMaterial({
          color: 0xffb3e6, emissive: 0xff55bb,
          emissiveIntensity: 1.3 - r*0.3,
          transparent: true, opacity: 0.85 - r*0.18,
        });
        const rm2 = new THREE.Mesh(rg, rm);
        rm2.position.set(pd.x, pd.y + pd.h/2 + 1.6, pd.z);
        rm2.rotation.x = Math.PI/2;
        rm2.userData.portalRing = true;
        rm2.userData.rIndex = r;
        scene.add(rm2);
        extraObjects.push(rm2);
      }
      // Glow light above final platform
      const fl = new THREE.PointLight(0xff55bb, 2.5, 15);
      fl.position.set(pd.x, pd.y + pd.h/2 + 3, pd.z);
      scene.add(fl);
      extraObjects.push(fl);
    }
  });

  // Place orbs
  const levelOrbs = def.orbs;
  levelOrbs.forEach((platIdx, oi) => {
    const pd   = def.platforms[platIdx];
    const msgI = def.msgIndices[oi];

    const orbGeo = new THREE.SphereGeometry(0.3, 16, 16);
    const orbMat = new THREE.MeshStandardMaterial({
      color: 0xff99dd, emissive: 0xff44cc, emissiveIntensity: 2.2,
      roughness: 0, metalness: 0,
    });
    const orb = new THREE.Mesh(orbGeo, orbMat);
    orb.position.set(pd.x, pd.y + pd.h/2 + 0.85, pd.z);
    orb.userData = { platformIndex: platIdx, collected: false, msgIndex: msgI };
    scene.add(orb);
    orbMeshes.push(orb);

    // Glow ring
    const rg = new THREE.TorusGeometry(0.42, 0.035, 8, 28);
    const rm = new THREE.MeshStandardMaterial({
      color: 0xffaaee, emissive: 0xffaaee, emissiveIntensity: 1.6,
    });
    const ring = new THREE.Mesh(rg, rm);
    ring.position.copy(orb.position);
    scene.add(ring);
    orb.userData.ring = ring;
    extraObjects.push(ring);
  });

  // Spawn player at first platform
  const sp = def.platforms[0];
  const spawnY = sp.y + sp.h/2 + PLAYER_H/2 + 0.05;
  pState.levelSpawn.set(sp.x, spawnY, sp.z);
  player.position.copy(pState.levelSpawn);
  pState.vel.set(0,0,0);
  pState.onGround = false;

  // Camera: snap to fixed offset behind spawn, no lerp on first frame
  camSmoothPos.set(
    sp.x + CAM_OFFSET_X,
    sp.y + CAM_OFFSET_Y,
    sp.z + CAM_OFFSET_Z
  );
  camera.position.copy(camSmoothPos);
  camLookAt.set(sp.x, sp.y + 1, sp.z);
}

// ── Level transition animation ────────────────────────────
function doLevelTransition(nextIdx) {
  pState.transitioning = true;
  const lt   = document.getElementById('level-transition');
  const ltT  = document.getElementById('lt-text');
  const name = nextIdx < LEVEL_DEFS.length ? LEVEL_DEFS[nextIdx].name : '';
  ltT.textContent = nextIdx < LEVEL_DEFS.length
    ? `✦ ${name} ✦`
    : '✦ Almost there... ✦';
  lt.classList.add('active');
  setTimeout(() => {
    if (nextIdx < LEVEL_DEFS.length) {
      loadLevel(nextIdx, true);
      pState.levelIndex = nextIdx;
    }
    setTimeout(() => {
      lt.classList.remove('active');
      pState.transitioning = false;
    }, 600);
  }, 700);
}

// ── Input ─────────────────────────────────────────────────
const keys = { w:false, a:false, s:false, d:false, space:false };
const dpad = { up:false, down:false, left:false, right:false, jump:false };

document.addEventListener('keydown', e => {
  if (e.code==='KeyW'||e.code==='ArrowUp')    keys.w=true;
  if (e.code==='KeyA'||e.code==='ArrowLeft')  keys.a=true;
  if (e.code==='KeyS'||e.code==='ArrowDown')  keys.s=true;
  if (e.code==='KeyD'||e.code==='ArrowRight') keys.d=true;
  if (e.code==='Space'){ e.preventDefault(); if(!keys.space){ pState.jumpBuffer=0.18; } keys.space=true; }
});
document.addEventListener('keyup', e => {
  if (e.code==='KeyW'||e.code==='ArrowUp')    keys.w=false;
  if (e.code==='KeyA'||e.code==='ArrowLeft')  keys.a=false;
  if (e.code==='KeyS'||e.code==='ArrowDown')  keys.s=false;
  if (e.code==='KeyD'||e.code==='ArrowRight') keys.d=false;
  if (e.code==='Space') keys.space=false;
});

function bindBtn(id, key) {
  const el = document.getElementById(id);
  if (!el) return;
  const on  = e => { e.preventDefault(); dpad[key]=true;  el.classList.add('pressed'); };
  const off = e => { e.preventDefault(); dpad[key]=false; el.classList.remove('pressed'); };
  el.addEventListener('touchstart', on,  {passive:false});
  el.addEventListener('touchend',   off, {passive:false});
  el.addEventListener('touchcancel',off, {passive:false});
  el.addEventListener('mousedown',  on);
  el.addEventListener('mouseup',    off);
  el.addEventListener('mouseleave', off);
}
bindBtn('btn-up',    'up');
bindBtn('btn-down',  'down');
bindBtn('btn-left',  'left');
bindBtn('btn-right', 'right');

// Jump buttons
['jump-btn-r'].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  const on  = e => { e.preventDefault(); dpad.jump=true;  pState&&(pState.jumpBuffer=0.18); el.classList.add('pressed'); };
  const off = e => { e.preventDefault(); dpad.jump=false; el.classList.remove('pressed'); };
  el.addEventListener('touchstart', on,  {passive:false});
  el.addEventListener('touchend',   off, {passive:false});
  el.addEventListener('touchcancel',off, {passive:false});
  el.addEventListener('mousedown',  on);
  el.addEventListener('mouseup',    off);
  el.addEventListener('mouseleave', off);
});

// ── HUD / Achievement ─────────────────────────────────────
function updateHUD() {
  document.getElementById('orb-counter').textContent = `${pState.collected} / 10`;
}

let achTimeout = null;
function showAchievement(text) {
  const box = document.getElementById('achievement');
  document.getElementById('ach-text').textContent = text;
  box.classList.add('show');
  if (achTimeout) clearTimeout(achTimeout);
  achTimeout = setTimeout(() => box.classList.remove('show'), 4500);
}

// ── Respawn flash ─────────────────────────────────────────
function flashRespawn() {
  const el = document.getElementById('respawn-flash');
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 180);
}

// ── AABB ──────────────────────────────────────────────────
function playerAABB() {
  const px=player.position.x, py=player.position.y, pz=player.position.z;
  return {
    minX:px-PLAYER_W/2, maxX:px+PLAYER_W/2,
    minY:py-PLAYER_H/2, maxY:py+PLAYER_H/2,
    minZ:pz-PLAYER_W/2, maxZ:pz+PLAYER_W/2,
  };
}
function platAABB(p) {
  return {
    minX:p.mesh.position.x-p.w/2, maxX:p.mesh.position.x+p.w/2,
    minY:p.mesh.position.y-p.h/2, maxY:p.mesh.position.y+p.h/2,
    minZ:p.mesh.position.z-p.d/2, maxZ:p.mesh.position.z+p.d/2,
  };
}
function overlapXZ(a,b){ return a.minX<b.maxX&&a.maxX>b.minX&&a.minZ<b.maxZ&&a.maxZ>b.minZ; }

// ── Final screen ──────────────────────────────────────────
function triggerFinal() {
  if (pState.finalTriggered) return;
  pState.finalTriggered = true;
  // Show 10th memory as achievement first
  showAchievement("You made it to the end with me 💕");
  const fs = document.getElementById('final-screen');
  for (let i=0;i<20;i++){
    const p  = document.createElement('div');
    p.className = 'particle';
    const sz = 4 + Math.random()*8;
    const cols = ['#ff69b4','#ffb3e6','#d4a8f4','#ffd6f0','#ff99dd'];
    p.style.cssText=`width:${sz}px;height:${sz}px;background:${cols[Math.floor(Math.random()*cols.length)]};left:${Math.random()*100}%;bottom:0;animation-duration:${3+Math.random()*4}s;animation-delay:${Math.random()*3}s;opacity:0;box-shadow:0 0 6px currentColor;`;
    fs.appendChild(p);
  }
  setTimeout(() => { fs.classList.add('visible'); pState.finishedGame=true; }, 1800);
}

// ── Main loop ─────────────────────────────────────────────
let lastTime = performance.now();
let animStarted = false;

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt  = Math.min((now - lastTime)/1000, 0.05);
  lastTime  = now;
  const t   = now * 0.001;

  if (!pState) { renderer.render(scene, camera); return; }
  if (pState.finishedGame) { renderer.render(scene, camera); return; }

  // ── Moving platforms ────────────────────────────────
  platforms.forEach(p => {
    if (!p.moving) return;

    const prevX = p.mesh.position.x;
    const prevZ = p.mesh.position.z;

    p.t += dt;
    const off = Math.sin(p.t * p.moveSpeed) * p.moveRange;

    if (p.moveAxis==='z') p.mesh.position.z = p.moveOrigin + off;
    else p.mesh.position.x = p.x + off;

    p.deltaX = p.mesh.position.x - prevX;
    p.deltaZ = p.mesh.position.z - prevZ;
  });

  // ── Portal rings ────────────────────────────────────
  extraObjects.forEach(c => {
    if (!c.userData.portalRing) return;
    const r = c.userData.rIndex;
    c.rotation.z = t*(0.55+r*0.28);
    c.rotation.x = Math.PI/2 + Math.sin(t*0.5+r)*0.14;
    c.material.emissiveIntensity = 1.1 + Math.sin(t*2+r)*0.4;
  });

  // ── Orbs ────────────────────────────────────────────
  orbMeshes.forEach(orb => {
    if (orb.userData.collected) return;
    const plat = platforms[orb.userData.platformIndex];
    orb.position.y = plat.mesh.position.y + plat.h/2 + 0.85 + Math.sin(t*2+orb.userData.platformIndex)*0.18;
    orb.rotation.y = t*1.3;
    orb.material.emissiveIntensity = 2.0 + Math.sin(t*3)*0.5;
    if (orb.userData.ring) {
      orb.userData.ring.position.copy(orb.position);
      orb.userData.ring.rotation.y = t*0.85;
    }
  });

  // ── Lights drift ────────────────────────────────────
  pinkLight.position.x = player.position.x + Math.sin(t*0.3)*6;
  pinkLight.position.z = player.position.z + Math.cos(t*0.4)*6;
  pinkLight.position.y = player.position.y + 8;
  purpleLight.position.x = player.position.x - 5;
  purpleLight.position.z = player.position.z - 10;

  if (pState.transitioning) { renderer.render(scene, camera); return; }

  // ── Input → movement vector (FIXED world-space axes) ──
  // Forward/back = ±X (the direction levels progress)
  // Left/right   = ±Z
  const fwd = (keys.w||dpad.up)    ? 1 : 0;
  const bwd = (keys.s||dpad.down)  ? 1 : 0;
  const lft = (keys.a||dpad.left)  ? 1 : 0;
  const rgt = (keys.d||dpad.right) ? 1 : 0;

  const mv = new THREE.Vector3(
    (fwd - bwd),   // +X = forward toward next platform
    0,
    (rgt - lft)    // +Z = strafe right, -Z = strafe left
  );
  if (mv.length() > 1) mv.normalize();

  pState.vel.x = mv.x * MOVE_SPEED;
  pState.vel.z = mv.z * MOVE_SPEED;

  // Turn the character model to face movement direction (visual only — doesn't affect camera)
  if (mv.length() > 0.05) {
    const targetAngle = Math.atan2(mv.x, mv.z);
    let curAngle = player.rotation.y;
    let diff = targetAngle - curAngle;
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    player.rotation.y += diff * 0.2;
  }

  // ── Jump ────────────────────────────────────────────
  if (pState.jumpBuffer > 0) pState.jumpBuffer -= dt;
  if (pState.jumpBuffer > 0 && pState.onGround) {
    pState.vel.y = JUMP_FORCE;
    pState.onGround = false;
    pState.jumpBuffer = 0;
  }

  // ── Gravity ─────────────────────────────────────────
  if (!pState.onGround) pState.vel.y += GRAVITY * dt;

  // ── Integrate ───────────────────────────────────────
  player.position.x += pState.vel.x * dt;
  player.position.y += pState.vel.y * dt;
  player.position.z += pState.vel.z * dt;

  // ── Collision ───────────────────────────────────────
  pState.onGround = false;
  standingPlatform = null;
  const pb = playerAABB();

  platforms.forEach(plat => {
    const ab = platAABB(plat);

    if (overlapXZ(pb, ab)) {
      // Land on top
      if (pState.vel.y <= 0.05 &&
          pb.minY <= ab.maxY + 0.08 &&
          pb.minY >= ab.maxY - 0.65) {
        player.position.y = ab.maxY + PLAYER_H/2;
        pState.vel.y = 0;
        pState.onGround = true;
        standingPlatform = plat;
        if (plat.isFinal && !pState.finalTriggered) triggerFinal();
      }
      // Hit ceiling
      else if (pState.vel.y > 0 &&
               pb.maxY >= ab.minY - 0.08 &&
               pb.maxY <= ab.minY + 0.65) {
        player.position.y = ab.minY - PLAYER_H/2;
        pState.vel.y = -0.5;
      }
    }

    // Side push
    const overlapY = pb.minY < ab.maxY - 0.12 && pb.maxY > ab.minY + 0.12;
    if (overlapY) {
      const ox = pb.minX < ab.maxX && pb.maxX > ab.minX;
      const oz = pb.minZ < ab.maxZ && pb.maxZ > ab.minZ;
      if (ox && oz) {
        const pens = [
          { v: ab.maxX - pb.minX, ax:'x', dir:+1 },
          { v: pb.maxX - ab.minX, ax:'x', dir:-1 },
          { v: ab.maxZ - pb.minZ, ax:'z', dir:+1 },
          { v: pb.maxZ - ab.minZ, ax:'z', dir:-1 },
        ];
        const best = pens.reduce((a,b)=>a.v<b.v?a:b);
        if (best.ax==='x'){ player.position.x += best.v*best.dir; pState.vel.x=0; }
        else              { player.position.z += best.v*best.dir; pState.vel.z=0; }
      }
    }
  });

  if (standingPlatform && standingPlatform.moving) {
    player.position.x += standingPlatform.deltaX || 0;
    player.position.z += standingPlatform.deltaZ || 0;
  }

  // ── Death / respawn ─────────────────────────────────
  if (player.position.y < DEATH_Y) {
    player.position.copy(pState.levelSpawn);
    pState.vel.set(0,0,0);
    pState.onGround = false;
    flashRespawn();
  }

  // ── Orb collection ──────────────────────────────────
  orbMeshes.forEach(orb => {
    if (orb.userData.collected) return;
    const d = player.position.distanceTo(orb.position);
    if (d < 1.05) {
      orb.userData.collected = true;
      orb.visible = false;
      if (orb.userData.ring) orb.userData.ring.visible = false;
      pState.collected++;
      updateHUD();
      showAchievement(MESSAGES[orb.userData.msgIndex]);

      // Check if all orbs on this level are collected → unlock exit
      const allCollected = orbMeshes.every(o => o.userData.collected);
      // (optional visual feedback — not blocking)
    }
  });

  // ── Level finish zone (non-final levels) ─────────────
  // When player reaches the LAST platform of a level (not the final level's special end)
  // and all orbs are collected, auto-advance after a moment
  if (!pState.finalTriggered) {
    const lastPlat = platforms[platforms.length - 1];
    const lp = platAABB(lastPlat);
    if (!lastPlat.isFinal && pState.onGround) {
      const pb2 = playerAABB();
      if (overlapXZ(pb2, lp) &&
          Math.abs(pb2.minY - lp.maxY) < 0.2 &&
          orbMeshes.every(o => o.userData.collected) &&
          pState.levelIndex < LEVEL_DEFS.length - 1 &&
          !pState._levelDone) {
        pState._levelDone = true;
        setTimeout(() => {
          pState._levelDone = false;
          doLevelTransition(pState.levelIndex + 1);
        }, 500);
      }
    }
  }

  // ── Camera: FIXED offset, translates with player only ──
  // Offset is constant in world space: behind (-X), above (+Y), centered (Z)
  // This means "forward" on the d-pad always goes toward the next platform
  // and the camera never spins when the character turns.
  const desiredCamX = player.position.x + CAM_OFFSET_X;
  const desiredCamY = player.position.y + CAM_OFFSET_Y;
  const desiredCamZ = player.position.z + CAM_OFFSET_Z;

  camSmoothPos.x += (desiredCamX - camSmoothPos.x) * 0.08;
  camSmoothPos.y += (desiredCamY - camSmoothPos.y) * 0.08;
  camSmoothPos.z += (desiredCamZ - camSmoothPos.z) * 0.08;

  camera.position.copy(camSmoothPos);

  // Always look slightly ahead of the player (toward +X = forward)
  const lookTarget = new THREE.Vector3(
    player.position.x + 3,
    player.position.y + 0.8,
    player.position.z
  );
  camLookAt.lerp(lookTarget, 0.1);
  camera.lookAt(camLookAt);

  renderer.render(scene, camera);
}

// ── Resize ───────────────────────────────────────────────
window.addEventListener('resize', () => {
  sizeGame();
  const W2 = container.clientWidth;
  const H2 = container.clientHeight;
  camera.aspect = W2/H2;
  camera.updateProjectionMatrix();
  renderer.setSize(W2, H2);
});

// ── Prevent page scroll on touch ─────────────────────────
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
</script>
