<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Game for V &lt;3</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Molle:ital@1&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle at 35% 45%, rgba(255,90,190,0.18), transparent 40%),
        radial-gradient(circle at 70% 25%, rgba(170,100,255,0.15), transparent 45%),
        linear-gradient(180deg,#120020 0%,#0a0018 100%);

    position:relative;
}

/* Background glow blobs */
body::before{
    content:"";
    position:absolute;
    inset:0;

    background:
        radial-gradient(circle at 25% 60%, rgba(255,100,180,0.10), transparent 30%),
        radial-gradient(circle at 75% 35%, rgba(170,100,255,0.10), transparent 30%);

    animation: drift 10s ease-in-out infinite alternate;
}

.title{
    position:relative;
    z-index:2;

    font-family:"Molle", cursive;
    font-size:clamp(50px,7vw,100px);

    color:#ffd6f0;
    text-align:center;

    text-shadow:
        0 0 10px rgba(255,150,220,0.9),
        0 0 25px rgba(255,120,200,0.8),
        0 0 50px rgba(255,100,180,0.7),
        0 0 90px rgba(255,80,180,0.45);

    animation: floaty 4.5s ease-in-out infinite;
}

.subtitle{
    position:relative;
    z-index:2;

    margin-top:18px;

    color:rgba(255,210,240,0.75);

    font-size:14px;
    letter-spacing:0.12em;
    text-align:center;
}

.start-btn{
    position:relative;
    z-index:2;

    margin-top:60px;

    font-family:"Molle", cursive;
    font-size:32px;

    color:#ffd6f0;

    padding:12px 48px;

    background:rgba(255,130,200,0.15);

    border:2px solid rgba(255,180,220,0.45);
    border-radius:999px;

    cursor:pointer;

    box-shadow:
        0 0 15px rgba(255,100,180,0.30),
        0 0 35px rgba(255,100,180,0.18);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
}

.start-btn:hover{
    transform:scale(1.06);

    background:rgba(255,130,200,0.22);

    box-shadow:
        0 0 25px rgba(255,100,180,0.55),
        0 0 60px rgba(255,100,180,0.30);
}

.start-btn:active{
    transform:scale(0.98);
}

.fade{
    position:fixed;
    inset:0;

    background:#120020;

    opacity:0;
    pointer-events:none;

    transition:opacity 1.2s ease;
}

.fade.show{
    opacity:1;
}

.sparkle{
    position:absolute;
    border-radius:50%;
    background:#ffd6f0;

    box-shadow:
        0 0 10px #ffd6f0,
        0 0 20px #ff9ddd;

    animation: twinkle linear infinite;
}

@keyframes floaty{
    0%{
        transform:translateY(0px) rotate(-0.6deg);
    }

    50%{
        transform:translateY(-10px) rotate(0.6deg);
    }

    100%{
        transform:translateY(0px) rotate(-0.6deg);
    }
}

@keyframes drift{
    from{
        transform:translateX(-10px) translateY(-10px);
    }

    to{
        transform:translateX(10px) translateY(10px);
    }
}

@keyframes twinkle{
    0%{
        opacity:0;
        transform:scale(0.5);
    }

    50%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:0;
        transform:scale(0.5);
    }
}
</style>
</head>
<body>

<div class="title">
    A Game for V &lt;3
</div>

<div class="subtitle">
    made with love
</div>

<button class="start-btn" onclick="startGame()">
    Start
</button>

<div class="fade" id="fade"></div>

<script>

// Create floating sparkles
for(let i=0;i<25;i++){

    const s = document.createElement("div");
    s.className = "sparkle";

    const size = 2 + Math.random()*5;

    s.style.width = size + "px";
    s.style.height = size + "px";

    s.style.left = Math.random()*100 + "%";
    s.style.top = Math.random()*100 + "%";

    s.style.animationDuration =
        (2 + Math.random()*4) + "s";

    s.style.animationDelay =
        (Math.random()*4) + "s";

    document.body.appendChild(s);
}

function startGame(){

    document.getElementById("fade")
        .classList.add("show");

    setTimeout(() => {

        // Change this if your game file
        // has a different name.
        window.location.href =
            "game.html";

    }, 1200);
}

</script>

</body>
</html>
